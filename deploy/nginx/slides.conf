# Open Slide's native editor requires its authoring server, including HMR.
# Include inside the application server block.
location = /slides {
    absolute_redirect off;
    return 308 /slides/$is_args$args;
}
# Old custom-editor bookmarks return to the native deck browser.
location = /slides/editor { return 302 /slides/; }
location = /slides/editor/ { return 302 /slides/; }
location /slides/ {
    # Keep authoring APIs in this access-control context, then restore their upstream path.
    rewrite ^/slides/(__[^/]+)(/.*)?$ /$1$2 break;
    client_max_body_size 50m;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
    proxy_buffering off;
    add_header Cache-Control "no-store";
}
# Internal routing makes /slides/ access controls apply to root-relative APIs too.
location ~ ^/__(edit|comments|design|notes|slides|assets|folders|gfonts|svgl|server-status)(/|$) {
    rewrite ^/(.*)$ /slides/$1 last;
}
