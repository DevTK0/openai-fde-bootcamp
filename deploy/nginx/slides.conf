# Saved edits are handled by a loopback-only service; static assets stay on nginx.
location ^~ /slides/api/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_set_header Host $http_host;
    client_max_body_size 512k;
    add_header Cache-Control "no-store";
}
location = /slides/editor {
    absolute_redirect off;
    return 308 /slides/editor/$is_args$args;
}
# Include inside the existing application server block.
# Publish apps/slides/dist/ to /var/www/openai-fde/slides/ first.
location = /slides {
    absolute_redirect off;
    return 308 /slides/$is_args$args;
}
location ^~ /slides/assets/ {
    root /var/www/openai-fde;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location /slides/ {
    root /var/www/openai-fde;
    try_files $uri $uri/ /slides/index.html;
    add_header Cache-Control "no-cache";
}
