<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="title desc"><title id="title">A pair becomes a complete recovery plan</title><desc id="desc">The initial input proposed a resource pair for one trip. The current input applies a complete set of assignments while retaining other commitments.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="760" height="375" rx="16" fill="#f8fafc"/><g font-family="system-ui, sans-serif" fill="#0f172a"><text x="28" y="38" font-size="23" fill="#0f172a">From resource records to a complete alternative</text><rect x="28" y="65" width="320" height="145" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="44" y="93" font-size="19" fill="#0f172a">Initial candidate</text><text x="44" y="119" font-size="16" fill="#0f172a">One bus + one crew</text><text x="44" y="144" font-size="16" fill="#0f172a">One target trip</text><text x="44" y="169" font-size="16" fill="#0f172a">Future schedules attached</text><path d="M364 140L396 140" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="412" y="65" width="320" height="145" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="428" y="93" font-size="19" fill="#0f172a">Current candidate</text><text x="428" y="119" font-size="16" fill="#0f172a">Every affected trip assigned</text><text x="428" y="144" font-size="16" fill="#0f172a">Substitutions applied to calendars</text><text x="428" y="169" font-size="16" fill="#0f172a">Other commitments retained</text><rect x="28" y="244" width="704" height="105" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="44" y="272" font-size="19" fill="#0f172a">Why the distinction matters</text><text x="44" y="298" font-size="16" fill="#0f172a">A bus can cover the next departure and still leave a later trip uncovered.</text><text x="44" y="323" font-size="16" fill="#0f172a">The comparison must evaluate the whole recovery.</text></g></svg>