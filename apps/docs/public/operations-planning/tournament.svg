<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 537" role="img" aria-labelledby="title desc"><title id="title">Groups advance two plans and finalists are ordered</title><desc id="desc">Two groups of six each advance two plans. Four finalists are ordered; the last singleton needs no comparison.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="760" height="537" rx="16" fill="#f8fafc"/><g font-family="system-ui, sans-serif" fill="#0f172a"><text x="28" y="38" font-size="23" fill="#0f172a">A tournament over 12 eligible plans</text><text x="28" y="67" font-size="16" fill="#475569">Illustrative grouping, not a measured run.</text><rect x="28" y="95" width="330" height="96" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="44" y="123" font-size="19" fill="#0f172a">Group A: 6 plans</text><text x="44" y="149" font-size="16" fill="#0f172a">Choose the best, remove it,</text><text x="44" y="174" font-size="16" fill="#0f172a">then choose the next best.</text><rect x="402" y="95" width="330" height="96" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="418" y="123" font-size="19" fill="#0f172a">Group B: 6 plans</text><text x="418" y="149" font-size="16" fill="#0f172a">Choose the best, remove it,</text><text x="418" y="174" font-size="16" fill="#0f172a">then choose the next best.</text><path d="M193 194L193 227" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M567 194L567 227" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="238" width="330" height="70" rx="10" fill="#dcfce7" stroke="#cbd5e1"/><text x="44" y="266" font-size="19" fill="#0f172a">2 survivors</text><rect x="402" y="238" width="330" height="70" rx="10" fill="#dcfce7" stroke="#cbd5e1"/><text x="418" y="266" font-size="19" fill="#0f172a">2 survivors</text><path d="M193 311L300 358" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M567 311L460 358" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="173" y="370" width="414" height="104" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="189" y="398" font-size="19" fill="#0f172a">Order the 4 finalists</text><text x="189" y="424" font-size="16" fill="#0f172a">Compare remaining plans repeatedly.</text><text x="189" y="449" font-size="16" fill="#0f172a">The last singleton advances without a call.</text><text x="28" y="510" font-size="17" fill="#0f172a">If more than five survive a round, form new groups and repeat.</text></g></svg>