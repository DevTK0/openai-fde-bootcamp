<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 563" role="img" aria-labelledby="title desc"><title id="title">The planner separates availability, policy eligibility and preference</title><desc id="desc">Code excludes physically unavailable alternatives. Decisions interprets written requirements before comparing eligible plans.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="760" height="563" rx="16" fill="#f8fafc"/><g font-family="system-ui, sans-serif" fill="#0f172a"><text x="28" y="38" font-size="23" fill="#0f172a">Availability, policy eligibility, then preference</text><rect x="28" y="65" width="704" height="88" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="44" y="93" font-size="19" fill="#0f172a">1. Construct complete alternatives</text><text x="44" y="119" font-size="16" fill="#0f172a">Read source schedules; apply incident and proposed assignments.</text><path d="M380 155L380 178" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="181" width="704" height="88" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/><text x="44" y="209" font-size="19" fill="#0f172a">2. Exclude physically unavailable plans</text><text x="44" y="235" font-size="16" fill="#0f172a">Code checks holds, absence, overlap, capacity and availability.</text><path d="M380 271L380 294" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="297" width="704" height="88" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="44" y="325" font-size="19" fill="#0f172a">3. Assess written requirements</text><text x="44" y="351" font-size="16" fill="#0f172a">Decisions checks each surviving plan: eligible, blocked or unresolved.</text><path d="M380 387L380 410" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="413" width="704" height="88" rx="10" fill="#dcfce7" stroke="#cbd5e1"/><text x="44" y="441" font-size="19" fill="#0f172a">4. Compare eligible plans</text><text x="44" y="467" font-size="16" fill="#0f172a">Decisions chooses preferred alternatives against the objective.</text><text x="28" y="536" font-size="17" fill="#0f172a">Excluded plans and AI assessments remain separate in the evidence.</text></g></svg>