<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 544" role="img" aria-labelledby="title desc"><title id="title">A complete recovery plan</title><desc id="desc">A resource pair for one trip becomes an alternative covering all affected trips and retaining other commitments.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="380" height="544" rx="16" fill="#f8fafc"/><g font-family="system-ui, sans-serif" fill="#0f172a"><text x="16" y="30" font-size="21" fill="#0f172a">A complete recovery plan</text><rect x="16" y="50" width="348" height="136" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="32" y="78" font-size="19" fill="#0f172a">Initial candidate</text><text x="32" y="104" font-size="16" fill="#0f172a">One bus + one crew</text><text x="32" y="129" font-size="16" fill="#0f172a">One target trip</text><text x="32" y="154" font-size="16" fill="#0f172a">Future schedules attached</text><path d="M190 190L190 218" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="16" y="230" width="348" height="136" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="32" y="258" font-size="19" fill="#0f172a">Current candidate</text><text x="32" y="284" font-size="16" fill="#0f172a">Every affected trip assigned</text><text x="32" y="309" font-size="16" fill="#0f172a">Substitutions applied to calendars</text><text x="32" y="334" font-size="16" fill="#0f172a">Other commitments retained</text><rect x="16" y="390" width="348" height="134" rx="10" fill="#fef3c7" stroke="#cbd5e1"/><text x="32" y="418" font-size="19" fill="#0f172a">Why it matters</text><text x="32" y="444" font-size="16" fill="#0f172a">Covering the next departure</text><text x="32" y="469" font-size="16" fill="#0f172a">can still leave a later trip uncovered.</text><text x="32" y="494" font-size="16" fill="#0f172a">Compare the whole recovery.</text></g></svg>