<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 630" role="img" aria-labelledby="title desc"><title id="title">From availability to preference</title><desc id="desc">Code checks availability. Decisions interprets policies and compares eligible plans.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="380" height="630" rx="16" fill="#f8fafc"/><g font-family="system-ui, sans-serif" fill="#0f172a"><text x="16" y="30" font-size="21" fill="#0f172a">From availability to preference</text><rect x="16" y="50" width="348" height="104" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="32" y="78" font-size="19" fill="#0f172a">1. Construct alternatives</text><text x="32" y="104" font-size="16" fill="#0f172a">Read schedules and apply the incident.</text><text x="32" y="129" font-size="16" fill="#0f172a">Assign every affected trip.</text><path d="M190 158L190 180" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="16" y="184" width="348" height="104" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/><text x="32" y="212" font-size="19" fill="#0f172a">2. Check physical availability</text><text x="32" y="238" font-size="16" fill="#0f172a">Code checks holds, absence, overlap,</text><text x="32" y="263" font-size="16" fill="#0f172a">capacity and availability.</text><path d="M190 292L190 314" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="16" y="318" width="348" height="104" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="32" y="346" font-size="19" fill="#0f172a">3. Assess written requirements</text><text x="32" y="372" font-size="16" fill="#0f172a">Decisions assesses each plan.</text><text x="32" y="397" font-size="16" fill="#0f172a">Eligible, blocked or unresolved.</text><path d="M190 426L190 448" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="16" y="452" width="348" height="104" rx="10" fill="#dcfce7" stroke="#cbd5e1"/><text x="32" y="480" font-size="19" fill="#0f172a">4. Compare eligible plans</text><text x="32" y="506" font-size="16" fill="#0f172a">Decisions chooses preferred plans</text><text x="32" y="531" font-size="16" fill="#0f172a">against the objective.</text><text x="16" y="586" font-size="17" fill="#0f172a">Exclusions and AI assessments</text><text x="16" y="610" font-size="17" fill="#0f172a">remain separate in the evidence.</text></g></svg>