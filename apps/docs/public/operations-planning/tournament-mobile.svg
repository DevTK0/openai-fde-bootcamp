<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 612" role="img" aria-labelledby="title desc"><title id="title">Twelve eligible plans become four ordered finalists</title><desc id="desc">Two groups each advance two plans. A singleton does not need another comparison.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs><rect width="380" height="612" rx="16" fill="#f8fafc"/><g font-family="system-ui, sans-serif" fill="#0f172a"><text x="16" y="30" font-size="22" fill="#0f172a">12 eligible plans</text><text x="16" y="55" font-size="15" fill="#0f172a">Illustrative grouping, not a measured run.</text><rect x="16" y="78" width="348" height="130" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="32" y="106" font-size="19" fill="#0f172a">Group A: 6 plans → 2 survivors</text><text x="32" y="132" font-size="16" fill="#0f172a">Choose the best and remove it.</text><text x="32" y="157" font-size="16" fill="#0f172a">Choose the next best.</text><rect x="16" y="228" width="348" height="130" rx="10" fill="#ede9fe" stroke="#cbd5e1"/><text x="32" y="256" font-size="19" fill="#0f172a">Group B: 6 plans → 2 survivors</text><text x="32" y="282" font-size="16" fill="#0f172a">Choose the best and remove it.</text><text x="32" y="307" font-size="16" fill="#0f172a">Choose the next best.</text><path d="M190 362L190 394" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="16" y="408" width="348" height="130" rx="10" fill="#dcfce7" stroke="#cbd5e1"/><text x="32" y="436" font-size="19" fill="#0f172a">Order the 4 finalists</text><text x="32" y="462" font-size="16" fill="#0f172a">Compare the remaining alternatives.</text><text x="32" y="487" font-size="16" fill="#0f172a">The last singleton advances</text><text x="32" y="512" font-size="16" fill="#0f172a">without another call.</text><text x="16" y="568" font-size="17" fill="#0f172a">If more than five survive, regroup</text><text x="16" y="592" font-size="17" fill="#0f172a">and repeat before the final order.</text></g></svg>